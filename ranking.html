<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking & Hall da Fama | Pontua</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/ranking.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="header-bar-container"></div>

      <main class="content-area">
        <div class="ranking-header">
          <h2>🏆 Ranking de Doadores</h2>
          <p style="color: var(--text-muted);">Os maiores doadores de notas fiscais do ciclo atual!</p>
        </div>

        <div class="ranking-tabs">
          <button id="tab-current" class="tab-btn active">📊 Ranking do Ciclo Atual</button>
          <button id="tab-hof" class="tab-btn">🏛️ Hall da Fama (Ciclos Anteriores)</button>
        </div>

        <!-- Seção: Ranking Atual -->
        <div id="ranking-current-section">
          <!-- Card de Posição Atual do Usuário -->
          <div id="my-ranking-position-container" style="max-width: 700px; margin: 0 auto 24px;">
            <!-- Renderizado via JS -->
          </div>

          <!-- Pódio dos Top 3 -->
          <div id="podium-container" class="podium-container">
            <!-- Renderizado via JS -->
          </div>

          <!-- Lista do Top 4 ao 10 -->
          <div class="card" style="max-width: 700px; margin: 0 auto; padding: 24px;">
            <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; border-bottom: 2px solid var(--surface-border); padding-bottom: 12px;">
              Top 10 do Ciclo
            </h3>
            <div id="ranking-list-container" class="ranking-list">
              <!-- Renderizado via JS -->
            </div>
          </div>
        </div>

        <!-- Seção: Hall da Fama -->
        <div id="ranking-hof-section" style="display: none; max-width: 700px; margin: 0 auto;">
          <div id="hof-list-container">
            <!-- Renderizado via JS -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
